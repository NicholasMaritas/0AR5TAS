<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archive media selector</title><link rel="stylesheet" href="archive-selector.css"><style>body{margin:0;background:#000}header{position:fixed;top:20px;left:20px;z-index:3200}button{font:12px Courier New,monospace;color:white;background:#000;border:1px solid white;padding:8px;cursor:pointer}.archive-media-selector .ticker{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin}.archive-media-selector .ticker__content{width:max-content}</style></head><body><header><button id="reset" type="button">Reset selection</button></header><main id="archive-host"></main><script type="module">import {createArchiveSelector} from './archive-selector.js'; const response=await fetch('./archive.html'); if(!response.ok)throw new Error('Archive could not load');document.querySelector('#archive-host').innerHTML=await response.text();const root=document.querySelector('[data-section-type="ticker-page"]');createArchiveSelector(root,{resetControl:document.querySelector('#reset')});</script></body></html>
