<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radio catalogue + player</title><link rel="stylesheet" href="./radio-player.css"><style>body{margin:0;padding:0;scrollbar-gutter:stable;display:flex;flex-direction:column}main{width:100%}</style></head><body><main data-fuct-radio></main><script type="module">import {mountRadioCatalogue} from "./radio-player.js";const response=await fetch("./catalogue.json");if(!response.ok)throw new Error("Catalogue unavailable");const data=await response.json();mountRadioCatalogue(document.querySelector("[data-fuct-radio]"),{tracks:data.tracks});</script></body></html>
