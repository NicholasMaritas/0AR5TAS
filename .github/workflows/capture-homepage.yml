# Rules P1-P9, B1-B7: verified references only; no guessing or unrelated page visits; equal viewports; report limitations.
name: Capture verified homepage reference
on:
  push:
    paths:
      - '.github/workflows/capture-homepage.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependency
        run: |
          npm install --no-save --no-package-lock playwright sharp
          npx playwright install chromium --with-deps
      - name: Capture homepages at identical viewport sizes
        run: node scripts/capture-homepage.mjs
      - name: Compare original and published clone at matched viewports
        run: node scripts/compare-homepage.mjs
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supreme-verified-homepage-reference
          path: reference/
          if-no-files-found: warn
      - name: Record reference artifacts for implementation
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/
          if ! git diff --cached --quiet; then
            git commit -m "Capture live homepage references for verified comparison"
            git push
          fi
